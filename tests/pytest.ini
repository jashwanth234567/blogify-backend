[pytest]
# ─────────────────────────────────────────────────────────────────────────────
# Blogify E2E Test Suite — pytest Configuration
# ─────────────────────────────────────────────────────────────────────────────

# Test discovery
testpaths = selenium_tests appium_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output & reporting
addopts =
    -v
    --tb=short
    --strict-markers
    --timeout=60
    --html=reports/blogify_html_report.html
    --self-contained-html

# Logging
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Custom markers
markers =
    selenium: marks tests as Selenium / Web E2E tests (deselect with '-m "not selenium"')
    appium: marks tests as Appium / Mobile E2E tests (deselect with '-m "not appium"')
    smoke: marks critical smoke-test cases
    regression: marks full regression test cases
    security: marks security-focused tests
    performance: marks performance benchmark tests
    admin: marks admin-panel tests
    slow: marks tests that take > 10 s
